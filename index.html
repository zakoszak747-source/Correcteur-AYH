<script>
/* Adaptateur autonome : IA via un service partagé (code d'accès) ou une clé personnelle */
(function(){
const ls=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
try{const q=new URLSearchParams(location.search);if(q.get('p')){localStorage.setItem('ayh_proxy',q.get('p'));localStorage.setItem('ayh_code',q.get('c')||'');history.replaceState(null,'',location.pathname)}}catch(e){}
const b64=b=>new Promise((ok,ko)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]);f.onerror=ko;f.readAsDataURL(b)});
const fail=(c,m)=>{if(window.msg)window.msg(m);const e=new Error(m);e.code=c;throw e};
async function call(input,o){const px=ls('ayh_proxy'),key=ls('ayh_key');
if(!px&&!key)fail('not_granted','Configure l’IA dans les réglages de l’accueil');
const content=[];for(const b of (o&&o.images)||[]){const pdf=b.type=='application/pdf';content.push({type:pdf?'document':'image',source:{type:'base64',media_type:pdf?'application/pdf':((b.type&&b.type.indexOf('image/')==0)?b.type:'image/jpeg'),data:await b64(b)}})}
content.push({type:'text',text:typeof input==='string'?input:JSON.stringify(input)});
const h={'content-type':'application/json'};let url;
if(px){url=px;h['x-access-code']=ls('ayh_code')}else{url='https://api.anthropic.com/v1/messages';h['x-api-key']=key;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
const bodyS=JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content}]});let r;
for(let t=0;t<3;t++){try{r=await fetch(url,{method:'POST',headers:h,body:bodyS})}catch(e){fail('error','Pas de connexion au service IA')}
if(r.status!=429||t==2)break;if(window.msg)window.msg('Limite de l’IA atteinte : nouvelle tentative dans 20 s…');await new Promise(z=>setTimeout(z,20000))}
if(!r.ok){let j={};try{j=await r.json()}catch(e){}const em=typeof j.error=='string'?j.error:((j.error&&j.error.message)||'');
if(j.error==='code refusé')fail('not_granted','Code d’accès refusé : vérifie le code dans Réglages de l’IA');
if(j.error&&j.error.type=='authentication_error')fail('error','La clé API du service est invalide ou désactivée');
if(j.error==='abonnement expiré')fail('error','Abonnement expiré : renouvelle-le auprès de ton fournisseur');
if(j.error==='abonnement suspendu')fail('error','Abonnement suspendu : contacte ton fournisseur');
if(j.error==='quota épuisé')fail('error','Quota du mois atteint : demande une recharge à ton fournisseur');
if(r.status==429)fail('rate_limited','Trop de demandes : réessaie dans un moment');
fail('error','Erreur du service IA ('+r.status+') '+String(em).slice(0,140))}
const d=await r.json();return (d.content||[]).filter(c=>c.type=='text').map(c=>c.text).join('')}
const sample=async(i,o)=>({text:await call(i,o),truncated:false});
sample.json=async(i,o)=>{const t=await call(i,o),a=t.indexOf('{'),z=t.lastIndexOf('}');return JSON.parse(a>=0&&z>a?t.slice(a,z+1):t)};
sample.limits=async()=>({images:true,pdf:true});
const dl={save:async({filename,data})=>{const MT=/\.docx$/i.test(filename)?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':/\.pdf$/i.test(filename)?'application/pdf':/\.zip$/i.test(filename)?'application/zip':/\.json$/i.test(filename)?'application/json':/\.rtf$/i.test(filename)?'application/rtf':'application/octet-stream',u=URL.createObjectURL(new Blob([data],{type:MT})),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},60000);return{status:'saved'}}};
window.claude={use:async n=>n=='sample'?sample:n=='downloads'?dl:null};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

+[...Array(e.nc).keys()].map(j=>`<label>Réponses attendues, consigne ${j+1}<textarea rows="3" oninput="s(this,'c.${ci}.i.${ii}.a.${j}')">${esc(x.a[j])}</textarea></label>`).join('')
+`<button class="x" onclick="di(${ci},${ii})">Supprimer cet indicateur</button></div>`).join('')
+`<button class="b s" onclick="ai(${ci})">Ajouter un indicateur</button><button class="x" onclick="dc(${ci})">Supprimer ce critère</button></div>`).join('')
+`<button class="b s" onclick="ac()">Ajouter un critère</button><button class="b s" onclick="fixCoh()">Séparer la cohérence en deux indicateurs (0,5 + 0,5)</button><button class="b s" onclick="clrAll()">Nettoyer les textes (LaTeX, &lt;br&gt;, symboles)</button><button class="b s" onclick="genPert()">Rédiger les 3 indicateurs de la pertinence (IA)</button><div id="pm" class="mu"></div><button class="b" onclick="cp()">Copies des élèves (photos)</button><button class="b" onclick="exG('docx')">Exporter la grille (Word)</button><button class="b s" onclick="exG('pdf')">Exporter la grille (PDF)</button><button class="b" onclick="exC('docx')">Exporter le corrigé type de toute l’épreuve (Word)</button><button class="b s" onclick="exC('pdf')">Exporter le corrigé type de toute l’épreuve (PDF)</button><button class="b" onclick="exS('docx')">Exporter le sujet de l’épreuve pour les élèves (Word)</button><button class="b s" onclick="exS('pdf')">Exporter le sujet de l’épreuve pour les élèves (PDF)</button><details class="card"><summary><b>Word compatible (RTF), si le .docx s’ouvre mal</b></summary><button class="b s" onclick="exR('sujet')">Sujet de l’épreuve (RTF)</button><button class="b s" onclick="exR('corrige')">Corrigé type (RTF)</button><button class="b s" onclick="exR('grille')">Grille de correction (RTF)</button></details><button class="b" onclick="cnc('${e.id}')">Concevoir une nouvelle épreuve à partir de celle-ci</button><button class="b s" onclick="exZ()">Exporter le dossier complet (ZIP : Word + PDF)</button><div id="xm" class="mu"></div><button class="b s" onclick="tpl()">Enregistrer cette grille comme modèle</button><button class="x" onclick="dl(this)">Supprimer l’épreuve</button>`;upd()}

RÈGLES DE NOTATION (justes et constantes d’une copie à l’autre) :
- Aucun point pour ce qui n’est pas écrit. La réponse peut se trouver à un autre endroit de la copie que celui attendu : elle compte alors.
- Accepte toute formulation, méthode ou unité équivalente et correcte, même si elle diffère du corrigé.
- Le texte barré ou raturé n’existe pas. Si l’élève donne deux réponses, retiens la dernière non barrée.

- Ne fais aucune faveur et ne note pas selon une impression générale. Applique le même barème à tous les élèves. En cas de doute sur le contenu, n’accorde que les points clairement justifiés par ce qui est lisible ; signale l’incertitude dans "j". Si seule la lecture est incertaine, mets "d":1 et explique précisément ce qui est incertain, sans inventer de réponse.

- Traite la situation-problème comme le contexte de l’exercice 1 : évalue les réponses de l’élève par rapport aux consignes et aux indicateurs de la grille, pas par rapport à une réponse générale inventée.
- Pour chaque indicateur, cherche la réponse réelle de l’élève sur toutes les pages, même si elle est écrite ailleurs que juste sous la consigne.
- AVANT de noter, lis la grille complète et le corrigé type. Pour chaque indicateur, identifie les éléments attendus, puis vérifie un par un lesquels sont réellement présents dans la copie.
- La grille est la référence principale : respecte exactement chaque critère, chaque indicateur et le maximum de points de chaque consigne. N’ajoute aucun critère personnel et ne remplace jamais la grille par une appréciation globale.
- Pour chaque indicateur et chaque consigne, attribue les points uniquement aux éléments attendus effectivement démontrés. Élément absent ou faux = aucun point pour cet élément ; élément partiellement correct = seulement les points correspondant aux éléments corrects, dans la limite du barème. N’accorde jamais la totalité parce que la réponse « semble bonne ».
- Le corrigé type sert de référence pour vérifier le fond. Accepte une formulation différente uniquement si elle exprime correctement la même idée scientifique ou la même démarche. N’accepte pas une réponse vague, hors sujet ou simplement liée au thème sans répondre à la consigne.
